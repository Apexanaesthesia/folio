<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Folio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* base reset (the published page previously relied on the host wrapper for this) */
[hidden]:not([hidden=until-found i]){display:none!important}
img{max-width:100%}
*,*::before,*::after{box-sizing:border-box}

/* ============================================================
   Design tokens — "the analyst's wall"
   ============================================================ */
:root{
  --canvas:#F8F7F4; --dot:#D6D4CE;
  --chrome:#FFFFFF; --chrome-2:#F1EFEA; --chrome-3:#E6E4DF;
  --line:#DDD9D2; --line-2:#C8C3BA;
  --ink:#1A2530; --ink-2:#4A5568; --ink-3:#718096;
  --accent:#475A4B; --accent-2:#5B6B5D; --accent-ink:#FFFFFF; --accent-soft:#E8EDE9; --accent-soft-2:#D1DBD3;
  --pin:#F2B705; --pin-soft:#FFF1B8;
  --sel:#2D6BEA; --sel-soft:rgba(45,107,234,.12);
  --frame-bg:#FFFFFF; --frame-line:#CFCAC2;
  --ok:#1F7A4C; --ok-soft:#DDF2E5;
  --warn:#8A5A00; --warn-soft:#FFF1D0;
  --danger:#B42318; --danger-soft:#FDE7E4;
  --paper-ink:#1A2530;
  --shadow-s:0 1px 1px rgba(26,37,48,.06),0 2px 6px rgba(26,37,48,.08);
  --shadow:0 1px 2px rgba(26,37,48,.08),0 10px 28px -6px rgba(26,37,48,.18);
  --shadow-l:0 2px 4px rgba(26,37,48,.08),0 24px 48px -12px rgba(26,37,48,.28);
  --note-shadow:0 1px 1px rgba(26,37,48,.10),0 6px 14px -6px rgba(26,37,48,.28);
  --note-shadow-lift:0 2px 3px rgba(26,37,48,.12),0 18px 30px -10px rgba(26,37,48,.40);
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --paper:"Atkinson Hyperlegible","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --r:12px; --r-s:8px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --canvas:#161918; --dot:#2E3230;
    --chrome:#1E2321; --chrome-2:#262B29; --chrome-3:#2F3532;
    --line:#384039; --line-2:#4A534C;
    --ink:#EAECE9; --ink-2:#AEB6B0; --ink-3:#7F8882;
    --accent:#9DB8A4; --accent-2:#B3CBB9; --accent-ink:#14201A; --accent-soft:#2A3A2F; --accent-soft-2:#37493D;
    --pin:#F3C33B; --pin-soft:#3A3010;
    --sel:#6A98F2; --sel-soft:rgba(106,152,242,.16);
    --frame-bg:#1B201E; --frame-line:#3A423D;
    --ok:#5CC48C; --ok-soft:#173226;
    --warn:#F3B34B; --warn-soft:#3A2B10;
    --danger:#F07464; --danger-soft:#3D1A16;
    --shadow-s:0 1px 1px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.35);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -6px rgba(0,0,0,.55);
    --shadow-l:0 2px 4px rgba(0,0,0,.4),0 24px 48px -12px rgba(0,0,0,.7);
    --note-shadow:0 1px 1px rgba(0,0,0,.3),0 6px 14px -6px rgba(0,0,0,.6);
    --note-shadow-lift:0 2px 3px rgba(0,0,0,.35),0 18px 30px -10px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#161918; --dot:#2E3230;
  --chrome:#1E2321; --chrome-2:#262B29; --chrome-3:#2F3532;
  --line:#384039; --line-2:#4A534C;
  --ink:#EAECE9; --ink-2:#AEB6B0; --ink-3:#7F8882;
  --accent:#9DB8A4; --accent-2:#B3CBB9; --accent-ink:#14201A; --accent-soft:#2A3A2F; --accent-soft-2:#37493D;
  --pin:#F3C33B; --pin-soft:#3A3010;
  --sel:#6A98F2; --sel-soft:rgba(106,152,242,.16);
  --frame-bg:#1B201E; --frame-line:#3A423D;
  --ok:#5CC48C; --ok-soft:#173226;
  --warn:#F3B34B; --warn-soft:#3A2B10;
  --danger:#F07464; --danger-soft:#3D1A16;
  --shadow-s:0 1px 1px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.35);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -6px rgba(0,0,0,.55);
  --shadow-l:0 2px 4px rgba(0,0,0,.4),0 24px 48px -12px rgba(0,0,0,.7);
  --note-shadow:0 1px 1px rgba(0,0,0,.3),0 6px 14px -6px rgba(0,0,0,.6);
  --note-shadow-lift:0 2px 3px rgba(0,0,0,.35),0 18px 30px -10px rgba(0,0,0,.75);
}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font:14px/1.4 var(--ui);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
#app{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);overflow:hidden}

/* ============================================================
   Canvas
   ============================================================ */
#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:default;
  background-color:var(--canvas);
  background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.3px);}
#viewport.t-hand,#viewport.panning{cursor:grab}
#viewport.panning:active{cursor:grabbing}
#viewport.t-sticky,#viewport.t-shape,#viewport.t-text,#viewport.t-frame,#viewport.t-line{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#l-frames,#l-items,#l-over,#l-cursors{position:absolute;left:0;top:0}
#l-lines{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#l-lines .hit{pointer-events:stroke;stroke:transparent;fill:none;cursor:pointer}
#l-lines .vis{fill:none;stroke-linecap:round;stroke-linejoin:round}
#l-lines .ah{stroke:none}

.it{position:absolute;left:0;top:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;translate:var(--tx,0px) var(--ty,0px)}
.sticky{background:linear-gradient(172deg,color-mix(in srgb,var(--c) 90%,#fff) 0%,var(--c) 42%,color-mix(in srgb,var(--c) 95%,#000) 100%);color:var(--paper-ink);box-shadow:var(--note-shadow);font-family:var(--paper);overflow:hidden;border-radius:2px;transition:box-shadow .16s ease,scale .16s ease,rotate .16s ease}
.sticky::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 30%)}
.sticky:hover{box-shadow:var(--note-shadow-lift)}
.sticky.dark{color:#F4F4F5}
.it.dragging,.it.rdrag{box-shadow:var(--note-shadow-lift);scale:1.02;rotate:-.4deg;z-index:999998!important}
.it.dragging.shape,.it.dragging.textitem{scale:1.02;rotate:0deg}
.it.pop{animation:pop .24s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{0%{scale:.86;opacity:.4}100%{scale:1;opacity:1}}
.st-body{position:absolute;display:flex;flex-direction:column;justify-content:center;gap:.45em;text-align:center;overflow:hidden;line-height:1.22}
.st-t{flex-shrink:0;overflow-wrap:anywhere;white-space:pre-wrap;min-height:1.2em;outline:none}
.sticky.code .st-t{font-weight:700}
.st-q{flex-shrink:0;font-style:italic;font-size:.74em;line-height:1.3;opacity:.82;overflow-wrap:anywhere;white-space:pre-wrap;text-align:left}
.st-foot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:4px;font-family:var(--ui);font-weight:500;overflow:hidden;white-space:nowrap}
.st-src{overflow:hidden;text-overflow:ellipsis;background:rgba(0,0,0,.08);border-radius:3px;padding:0 .4em;line-height:1.5}
.sticky.dark .st-src{background:rgba(255,255,255,.16)}
.st-votes{display:flex;align-items:center;gap:.25em;font-family:var(--mono);flex:none}
.st-votes i{display:inline-block;width:.75em;height:.75em;border-radius:50%;background:#1F5FD6;box-shadow:0 0 0 1.5px #fff}
.st-votes i.mine{background:#0B7A64}
.st-new{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:#E0341E;box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.shape{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--paper-ink);font-family:var(--paper);transition:box-shadow .16s ease,scale .16s ease,rotate .16s ease}
.shape.dark{color:#F4F4F5}
.shape .sh-bg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.shape .sh-css{position:absolute;inset:0;background:var(--c);border:2px solid color-mix(in srgb,var(--c) 60%,#000)}
.shape.sh-oval .sh-css{border-radius:50%}
.shape.sh-pill .sh-css{border-radius:9999px}
.shape.sh-rect .sh-css{border-radius:4px}
.sh-t{position:relative;padding:8%;overflow-wrap:anywhere;white-space:pre-wrap;outline:none;min-width:1em}
.textitem{color:var(--ink);font-family:var(--ui);font-weight:600;line-height:1.2}
.textitem .tx{white-space:pre-wrap;overflow-wrap:anywhere;outline:none;min-height:1.2em}
.it.dim,.frame.dim{opacity:.18}
.it.hl{box-shadow:0 0 0 calc(3px * var(--inv)) var(--pin),0 5px 10px -4px rgba(0,0,0,.22)}
.it.editing{z-index:999999!important}
.it.rdrag{transition:none}

/* frames: tabbed sheets */
.frame{position:absolute;left:0;top:0;box-sizing:border-box;translate:var(--tx,0px) var(--ty,0px)}
.fr-body{position:absolute;inset:0;background:color-mix(in srgb,var(--frame-bg) 90%,var(--c));border:calc(1.5px * var(--inv)) solid color-mix(in srgb,var(--c) 55%,var(--frame-line));border-radius:calc(8px * var(--inv));box-shadow:inset 0 0 0 calc(1px * var(--inv)) color-mix(in srgb,var(--frame-bg) 60%,transparent)}
.frame.k-group .fr-body{background:color-mix(in srgb,var(--frame-bg) 50%,transparent);border-style:dashed;border-color:var(--line-2)}
.frame.k-lane .fr-body{background:color-mix(in srgb,var(--frame-bg) 78%,var(--c));border-radius:0;border-color:color-mix(in srgb,var(--c) 40%,var(--frame-line))}
.frame.k-family .fr-body{background:color-mix(in srgb,var(--frame-bg) 84%,var(--c));border-style:solid;border-color:color-mix(in srgb,var(--c) 45%,var(--frame-line))}
.frame.k-family .fr-head{background:color-mix(in srgb,var(--c) 45%,var(--chrome));font-size:14px}
.frame.k-family .fr-title{font-size:14px}
.fr-head{position:absolute;left:0;bottom:100%;max-width:max(calc(var(--fw) * var(--z) * 1px),320px);overflow:hidden;transform-origin:0 100%;transform:scale(var(--inv));display:flex;align-items:center;gap:8px;padding:5px 12px 6px 10px;margin-bottom:-1px;white-space:nowrap;cursor:pointer;font-family:var(--ui);background:color-mix(in srgb,var(--c) 70%,var(--chrome));border:1px solid color-mix(in srgb,var(--c) 55%,var(--frame-line));border-bottom:0;border-radius:9px 9px 0 0;color:var(--paper-ink);box-shadow:0 -1px 0 rgba(255,255,255,.35) inset}
.frame.k-group .fr-head{background:var(--chrome-2);border-color:var(--line-2);border-style:dashed;color:var(--ink-2)}
.frame.k-lane .fr-head{border-radius:6px 6px 0 0}
.fr-dot{width:10px;height:10px;border-radius:3px;background:color-mix(in srgb,var(--c) 70%,#000);flex:none;opacity:.9}
.frame.k-group .fr-dot{background:var(--ink-3)}
.fr-title{font-weight:600;font-size:15px;color:inherit;max-width:560px;min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.fr-count{flex:none;font:500 11.5px var(--mono);color:var(--paper-ink);opacity:.72;background:rgba(255,255,255,.55);border-radius:999px;padding:1px 8px}
.frame.k-group .fr-count{background:var(--chrome);color:var(--ink-2)}
#world.zoomed-out .fr-count{display:none}
#world.zoomed-out .fr-title{font-size:17px}
.frame.k-group .fr-title{font-weight:500}
.fr-head input{font:600 15px var(--ui);border:1px solid var(--sel);border-radius:4px;padding:1px 4px;background:var(--chrome);color:var(--ink);width:320px}

/* overlay */
.selbox{position:absolute;box-sizing:border-box;border:calc(1.5px * var(--inv)) solid var(--sel);pointer-events:none;border-radius:calc(2px * var(--inv))}
.selbox.multi{border-style:dashed}
.selbox.remote{border-width:calc(2px * var(--inv))}
.hd{position:absolute;width:calc(11px * var(--inv));height:calc(11px * var(--inv));margin:calc(-5.5px * var(--inv)) 0 0 calc(-5.5px * var(--inv));background:var(--chrome);border:calc(1.5px * var(--inv)) solid var(--sel);border-radius:50%;box-sizing:border-box;pointer-events:auto;touch-action:none}
.hd.nw,.hd.se{cursor:nwse-resize}.hd.ne,.hd.sw{cursor:nesw-resize}.hd.n,.hd.s{cursor:ns-resize}.hd.e,.hd.w{cursor:ew-resize}
.le{position:absolute;width:calc(13px * var(--inv));height:calc(13px * var(--inv));margin:calc(-6.5px * var(--inv)) 0 0 calc(-6.5px * var(--inv));background:var(--sel);border:calc(2px * var(--inv)) solid var(--chrome);border-radius:50%;box-sizing:border-box;pointer-events:auto;cursor:move}
.marquee{position:absolute;border:calc(1px * var(--inv)) solid var(--sel);background:var(--sel-soft);pointer-events:none}
.cghost{position:absolute;border:calc(1.5px * var(--inv)) dashed var(--sel);background:var(--sel-soft);pointer-events:none}
.dropt{position:absolute;box-sizing:border-box;border:calc(3px * var(--inv)) solid var(--accent);border-radius:calc(10px * var(--inv));pointer-events:none;animation:dropPulse .9s ease-in-out infinite alternate}
@keyframes dropPulse{from{opacity:.55}to{opacity:1}}
.guide{position:absolute;background:var(--accent-2);pointer-events:none;opacity:.9}
.guide.gx{width:calc(1px * var(--inv))}
.guide.gy{height:calc(1px * var(--inv))}
.guide::before,.guide::after{content:"";position:absolute;width:calc(5px * var(--inv));height:calc(5px * var(--inv));background:var(--accent-2);border-radius:50%}
.guide.gx::before{left:calc(-2px * var(--inv));top:calc(-2px * var(--inv))}
.guide.gx::after{left:calc(-2px * var(--inv));bottom:calc(-2px * var(--inv))}
.guide.gy::before{top:calc(-2px * var(--inv));left:calc(-2px * var(--inv))}
.guide.gy::after{top:calc(-2px * var(--inv));right:calc(-2px * var(--inv))}
.rc{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;transition:transform .09s linear}
.rc svg{display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.rc span{position:absolute;left:14px;top:16px;font:500 12px var(--ui);color:#fff;padding:2px 8px;border-radius:999px;white-space:nowrap}
.rc.idle{opacity:.45}

/* ============================================================
   Chrome: surfaces, buttons, tooltips
   ============================================================ */
.card{background:var(--chrome);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-s)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:var(--chrome);font-weight:500;font-size:13px;white-space:nowrap;transition:background .12s,border-color .12s,transform .08s}
.btn:hover{background:var(--chrome-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--chrome-2)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.sm{height:28px;padding:0 9px;font-size:12px;border-radius:7px}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib{width:38px;height:38px;display:grid;place-items:center;border:0;background:transparent;border-radius:9px;color:var(--ink);position:relative;transition:background .12s,color .12s}
.ib:hover{background:var(--chrome-2)}
.ib.on{background:var(--accent);color:var(--accent-ink)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib:disabled{opacity:.35;cursor:default}
.ib .caret{position:absolute;right:4px;bottom:4px;width:0;height:0;border-left:4px solid transparent;border-top:4px solid currentColor;opacity:.55;transform:rotate(-45deg)}
.kbd{font:500 11px var(--mono);color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--chrome)}
.tip{position:relative}
.sep{width:26px;height:1px;background:var(--line);margin:4px auto}

/* tooltips */
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;z-index:80;pointer-events:none;opacity:0;transform:translateY(2px);transition:opacity .12s,transform .12s;background:var(--ink);color:var(--canvas);font:500 12px/1 var(--ui);padding:7px 9px;border-radius:7px;white-space:nowrap;box-shadow:var(--shadow)}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;transform:translateY(0);transition-delay:.35s}
[data-tip].tipr::after{left:calc(100% + 10px);top:50%;transform:translate(0,-50%) translateX(-2px)}
[data-tip].tipr:hover::after{transform:translate(0,-50%)}
[data-tip].tipb::after{top:calc(100% + 8px);left:50%;transform:translate(-50%,-2px)}
[data-tip].tipb:hover::after{transform:translate(-50%,0)}
[data-tip].tipt::after{bottom:calc(100% + 8px);left:50%;transform:translate(-50%,2px)}
[data-tip].tipt:hover::after{transform:translate(-50%,0)}

/* top bar */
#topbar{position:absolute;left:16px;right:16px;top:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:30}
#topbar>*{pointer-events:auto}
#brand{flex:0 1 auto;display:flex;align-items:center;gap:10px;padding:5px 8px 5px 6px;min-width:0;max-width:min(600px,62vw);height:48px}
#brand .mark{width:32px;height:32px;flex:none;display:grid;place-items:center}
#brand .mark svg{width:32px;height:32px;display:block;filter:drop-shadow(0 1px 1px rgba(26,23,48,.18))}
.wordmark{font:600 21px/1 var(--display);letter-spacing:-.015em;color:var(--accent);flex:none;font-variation-settings:"opsz" 24}
.slash{width:1px;height:22px;background:var(--line-2);flex:none;margin:0 2px}
#title{border:1px solid transparent;background:transparent;font:600 16px var(--display);letter-spacing:-.005em;padding:4px 8px;border-radius:7px;min-width:60px;width:100%;text-overflow:ellipsis;color:var(--ink)}
#title:hover{border-color:var(--line);background:var(--chrome-2)}
#title:focus{border-color:var(--sel);outline:none;background:var(--chrome)}
#b-boards{flex:none;width:30px;height:30px}
.boards .blist{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto}
.boards .brow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px;border:1px solid transparent;border-radius:8px;background:transparent;font:inherit;color:var(--ink);cursor:pointer}
.boards .brow:hover{background:var(--chrome-2)}
.boards .brow.on{border-color:var(--line);background:var(--accent-soft)}
.boards .brow .bt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13px}
.boards .brow small{color:var(--ink-3);white-space:nowrap;font-size:11px}
.boards input[type=text]{flex:1;min-width:0;font:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--chrome);color:var(--ink)}
.boards .note{font-size:12px;color:var(--ink-2);line-height:1.45}
#status{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink-2);white-space:nowrap;padding:4px 10px 4px 8px;border-radius:999px;background:var(--chrome-2);flex:none}
#status .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);box-shadow:0 0 0 2px color-mix(in srgb,var(--ink-3) 25%,transparent)}
#status.live .dot{background:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 25%,transparent)}
#status.saving .dot{background:var(--pin);box-shadow:0 0 0 2px color-mix(in srgb,var(--pin) 30%,transparent);animation:blink 1s ease-in-out infinite}
#status.local .dot{background:var(--ink-3)}
@keyframes blink{50%{opacity:.4}}
#right{flex:none;display:flex;align-items:center;gap:4px;padding:5px;height:48px}
#right .btn.ghost.on{background:var(--accent-soft);color:var(--accent)}
#avatars{display:flex;align-items:center;padding:0 8px 0 6px}
#avatars button{width:30px;height:30px;border-radius:50%;border:2px solid var(--chrome);margin-left:-9px;padding:0;overflow:hidden;background:var(--chrome-2);display:grid;place-items:center;font:600 11px var(--ui);color:#fff;box-shadow:0 0 0 1px var(--line);transition:transform .12s}
#avatars button:first-child{margin-left:0}
#avatars button:hover{transform:translateY(-2px)}
#avatars button img{width:100%;height:100%;object-fit:cover}
#avatars button.follow{box-shadow:0 0 0 2px var(--sel)}
#avatars .more{background:var(--ink-2)}
#here{font:500 12px var(--ui);color:var(--ink-2);padding:0 10px 0 4px;white-space:nowrap}
#here:empty{display:none}
#b-share{margin-left:4px}

/* tool dock */
#tools{position:absolute;left:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:20}
#tools .grp{display:flex;flex-direction:column;padding:5px;gap:2px}
#tools .ib{width:40px;height:40px}

/* context toolbar */
#ctx{position:absolute;display:flex;align-items:center;gap:2px;padding:4px;z-index:20;white-space:nowrap;box-shadow:var(--shadow)}
#ctx .sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.18);margin:0 5px;box-shadow:inset 0 0 0 2px var(--chrome)}
#ctx .vsep{width:1px;height:22px;background:var(--line);margin:0 4px}
#ctx .ib{width:32px;height:32px}
#ctx .ib svg{width:18px;height:18px}
#ctx .tlabel{font-size:12px;color:var(--ink-2);padding:0 6px}

.pop{position:absolute;z-index:72;padding:10px;box-shadow:var(--shadow-l);animation:popIn .14s cubic-bezier(.2,.8,.2,1)}
@keyframes popIn{from{opacity:0;transform:translateY(4px) scale(.98)}to{opacity:1;transform:none}}
.palette{display:grid;grid-template-columns:repeat(4,30px);gap:8px}
.palette button{width:30px;height:30px;border-radius:7px;border:1px solid rgba(0,0,0,.14);padding:0;transition:transform .1s}
.palette button:hover{transform:scale(1.08)}
.palette button.on{box-shadow:0 0 0 2px var(--chrome),0 0 0 4px var(--sel)}
.menu{display:flex;flex-direction:column;min-width:220px;padding:6px}
.menu button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px;font-size:13px}
.menu button:hover{background:var(--chrome-2)}
.menu button.danger{color:var(--danger)}
.menu button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.menu button .kbd{margin-left:auto}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .mh{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:6px 10px 2px;font-weight:600}
.menu .swatches{display:flex;gap:6px;padding:6px 10px 8px;flex-wrap:wrap}
.menu .swatches button{width:22px;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.15);padding:0}

/* zoom + overview */
#zoombar{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:20}
#minimap{display:block;width:196px;height:128px;border-radius:var(--r);cursor:pointer}
#zoomctl{display:flex;align-items:center;gap:2px;padding:3px}
#zoomctl .ib{width:34px;height:34px}
#zoomctl .pct{font:500 12px var(--mono);min-width:56px;text-align:center;border:0;background:transparent;height:34px;border-radius:7px;font-variant-numeric:tabular-nums}
#zoomctl .pct:hover{background:var(--chrome-2)}
#zoomctl .vsep{width:1px;height:20px;background:var(--line);margin:0 3px}

#pills{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;gap:8px;z-index:15;pointer-events:none}
#pills>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;font-weight:500;font-size:13px;white-space:nowrap}
.pill .num{font:500 15px var(--mono);font-variant-numeric:tabular-nums}
.pill.timer.low{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.pill.timer.done{background:var(--danger);border-color:var(--danger);color:#fff}
.pill.vote{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pill button{border:0;background:transparent;padding:2px 4px;border-radius:4px;font-size:12px;color:inherit;text-decoration:underline}

#since{position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;font-size:13px;z-index:12}
#since b{font-weight:600}

#toasts{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none;width:min(560px,calc(100vw - 32px))}
#cb-reset{margin-bottom:10px}
#b-retry{margin-left:6px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;background:var(--ink);color:var(--canvas);border-radius:999px;box-shadow:var(--shadow-l);font-size:13px;max-width:min(520px,calc(100vw - 32px));animation:toastIn .22s cubic-bezier(.2,.8,.2,1)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast button{border:0;background:rgba(255,255,255,.14);color:inherit;font-weight:600;padding:4px 10px;border-radius:999px}
.toast button:hover{background:rgba(255,255,255,.24)}

/* ============================================================
   Side panel
   ============================================================ */
#panel{position:absolute;right:16px;top:70px;bottom:180px;width:380px;display:flex;flex-direction:column;overflow:hidden;z-index:25;box-shadow:var(--shadow)}
#panel[hidden]{display:none!important}
#ptabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none;align-items:flex-end}
#ptabs button{border:0;background:transparent;padding:8px 10px 10px;font-size:13px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;border-radius:6px 6px 0 0}
#ptabs button:hover{color:var(--ink);background:var(--chrome-2)}
#ptabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
#ptabs .x{margin-left:auto;padding:6px 8px;margin-bottom:4px;width:32px;height:32px}
#pbody{flex:1;overflow-y:auto;padding:14px 16px 20px;overscroll-behavior:contain}
.ph{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 8px;font-weight:600}
.ph:first-child{margin-top:0}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:12px}
.stats div{background:var(--chrome-2);border-radius:9px;padding:8px 8px 6px}
.stats b{display:block;font:500 19px var(--mono);font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--ink-2)}
.stats .warn{background:var(--warn-soft);color:var(--warn)}
.stats .warn span{color:var(--warn)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:500;color:var(--ink-2)}
.inp{border:1px solid var(--line-2);background:var(--chrome);border-radius:8px;padding:7px 9px;width:100%;box-sizing:border-box;font-size:13px;color:var(--ink)}
textarea.inp{resize:vertical;min-height:70px;line-height:1.45}
.inp:focus{outline:none;border-color:var(--sel);box-shadow:0 0 0 3px var(--sel-soft)}
.search{position:relative;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--line);background:var(--chrome);font-size:12px;font-weight:500;max-width:100%;transition:background .12s}
.chip:hover{background:var(--chrome-2)}
.chip.on{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.chip small{font-family:var(--mono);opacity:.7}
.chip .chipmain{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;padding:0;color:inherit;font:inherit}
.chip .aa{border:0;background:transparent;color:inherit;opacity:.45;font:600 11px var(--ui);padding:0 3px;margin-left:2px;border-radius:4px;letter-spacing:-.02em}
.chip .aa.on{opacity:1;background:var(--pin);color:#1A1D23}
.chip:not(.on) .aa.on{background:var(--pin-soft)}
.theme{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.theme>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer;background:var(--chrome)}
.theme>summary:hover{background:var(--chrome-2)}
.theme>summary::-webkit-details-marker{display:none}
.theme>summary .sw{width:12px;height:12px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.theme>summary .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.theme>summary .ct{font:500 12px var(--mono);color:var(--ink-2);white-space:nowrap}
.theme .bar{height:3px;background:var(--chrome-2)}
.theme .bar i{display:block;height:100%;background:var(--accent)}
.theme.unassigned>summary{background:var(--warn-soft)}
.theme.unassigned>summary .nm{color:var(--warn)}
.theme .sub{margin:0 8px 8px;border-radius:8px}
.codes{list-style:none;margin:0;padding:2px 0 6px}
.codes li{display:flex;gap:8px;padding:6px 10px;cursor:pointer;align-items:flex-start}
.codes li:hover{background:var(--chrome-2)}
.codes li .cs{width:8px;height:8px;border-radius:2px;margin-top:5px;flex:none}
.codes li .cm{flex:1;min-width:0}
.codes li .ctt{font-weight:500;font-size:13px}
.codes li .cq{font-size:12px;color:var(--ink-2);font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.codes li .src{font-size:11px;color:var(--ink-3)}
.codes li .vv{font:500 11px var(--mono);color:var(--accent);white-space:nowrap}
.note{font-size:12px;color:var(--ink-2);line-height:1.5}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:9px 11px;font-size:12px;line-height:1.45;margin-bottom:12px}
.warnbox b{font-weight:600}
.okbox{background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:9px 11px;font-size:12px;margin-bottom:12px}
.prev{border:1px solid var(--line);border-radius:9px;max-height:220px;overflow:auto;margin-bottom:12px}
.prev div{padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px}
.prev div:last-child{border-bottom:0}
.prev b{font-weight:600}
.prev em{color:var(--ink-2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.swrow{display:flex;flex-wrap:wrap;gap:6px}
.swrow button{width:24px;height:24px;border-radius:6px;border:1px solid rgba(0,0,0,.15);padding:0}
.swrow button.on{box-shadow:0 0 0 2px var(--chrome),0 0 0 4px var(--sel)}
.check{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px}
.meta-line{font-size:12px;color:var(--ink-3);margin-top:6px}
.sug{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.sug label{display:flex;gap:8px;align-items:flex-start;font-weight:600}
.sug p{margin:4px 0 0 24px;font-size:12px;color:var(--ink-2)}
.sug ul{margin:6px 0 0 24px;padding:0 0 0 14px;font-size:12px}
.tag-new{font:500 10px var(--mono);background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 5px;margin-left:4px}
.outbox{font:12px/1.45 var(--mono);width:100%;height:160px;box-sizing:border-box}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--chrome)}
.seg button{border:0;background:var(--chrome);padding:5px 10px;font-size:12px;font-weight:500}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button.on{background:var(--ink);color:var(--canvas)}

/* empty state */
#empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);width:min(560px,calc(100vw - 32px));padding:26px 28px 24px;box-sizing:border-box;z-index:10;box-shadow:var(--shadow-l)}
#empty .brandline,#signin .brandline{display:flex;align-items:center;gap:12px;margin-bottom:14px}
#empty .brandline svg,#signin .brandline svg{width:40px;height:40px}
#empty .brandline .wordmark,#signin .brandline .wordmark{font-size:28px}
#signin{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);width:min(460px,calc(100vw - 32px));padding:26px 28px 24px;z-index:70;box-shadow:var(--shadow-l)}
#signin h2{margin:0 0 6px;font:600 22px/1.2 var(--display);text-wrap:balance;letter-spacing:-.01em}
#signin p{margin:0 0 14px;color:var(--ink-2)}
#signin .note{margin-bottom:12px}
#empty h2{margin:0 0 6px;font:600 22px/1.2 var(--display);text-wrap:balance;letter-spacing:-.01em}
#empty p{margin:0 0 16px;color:var(--ink-2);max-width:52ch}
#empty .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
#empty .tile{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--chrome);transition:border-color .12s,background .12s,transform .1s}
#empty .tile:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
#empty .tile:disabled{opacity:.5;transform:none}
#empty .tile svg{width:22px;height:22px;fill:none;stroke:var(--accent);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#empty .tile b{font-size:13px}
#empty .tile span{font-size:12px;color:var(--ink-2);line-height:1.35}
#empty .row{gap:8px}
#empty .hint{font-size:12px;color:var(--ink-3);margin-top:12px}

/* shortcuts overlay */
#help{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,calc(100vw - 32px));max-height:calc(100% - 48px);overflow:auto;padding:22px 24px;z-index:65;box-shadow:var(--shadow-l)}
#help h2{margin:0 0 4px;font:600 22px var(--display)}
#help .sub{color:var(--ink-2);font-size:13px;margin:0 0 14px}
#help .cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 28px}
#help .kl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
#help .kl span:last-child{display:flex;gap:4px}
#help .close{position:absolute;right:10px;top:10px}

/* share popover */
.sharebox{width:320px;display:flex;flex-direction:column;gap:10px}
.sharebox .role{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px}
.sharebox .role svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sharebox .people{display:flex;flex-direction:column;gap:6px}
.sharebox .person{display:flex;align-items:center;gap:8px;font-size:13px}
.sharebox .person .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 10px var(--ui);color:#fff;overflow:hidden;flex:none}
.sharebox .person .av img{width:100%;height:100%;object-fit:cover}
.sharebox .person small{color:var(--ink-3);margin-left:auto}
.sharebox ol{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.sharebox ol b{color:var(--ink)}

#measure{position:absolute;left:-99999px;top:0;visibility:hidden;contain:strict;font-family:var(--paper)}
body.readonly #tools [data-tool]:not([data-tool="select"]):not([data-tool="hand"]){opacity:.35}

@media (max-width:760px){
  #tools{left:50%;top:auto;bottom:12px;transform:translateX(-50%);flex-direction:row;max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none}
  #tools .grp{flex-direction:row}
  .sep{width:1px;height:24px;margin:auto 4px}
  #zoombar{bottom:72px}
  #minimap{display:none}
  #panel{left:16px;right:16px;width:auto;top:auto;bottom:72px;height:62vh}
  #since{bottom:124px}
  #brand{max-width:52vw}
  #status .txt{display:none}
  #here{display:none}
  .hide-sm{display:none!important}
  #toasts{bottom:128px}
  #empty .tiles{grid-template-columns:1fr}
  #help .cols{grid-template-columns:1fr}
  [data-tip]::after{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============================================================
   AI mode
   ============================================================ */
.aibox{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.aibox p{margin:4px 0 0;font-size:13px;line-height:1.5}
.ailabel{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.aicard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--chrome)}
.aicard.done{opacity:.6}
.aicard p{margin:2px 0 0;font-size:13px;line-height:1.5}
.aicard .cq{font-style:italic;color:var(--ink-2);font-size:12px;margin-top:6px}
.aititle{font-weight:600;font-size:13px}
.aiaction{font-size:12px;color:var(--accent);margin-top:6px}
.kind{font:500 11px var(--ui);padding:1px 8px;border-radius:999px;background:var(--chrome-2);color:var(--ink-2);border:1px solid var(--line)}
.kind.k-misplaced,.kind.k-overlap,.kind.k-too-broad{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.kind.k-thin-evidence,.kind.k-gap{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.kind.k-insight,.kind.k-next-step{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tsum{margin:6px 10px 0;padding:8px 10px;background:var(--accent-soft);border-radius:8px}
.tsum p{margin:3px 0 0;font-size:12px;line-height:1.45}
.tsum .cq{font-style:italic;color:var(--ink-2)}
.sticky.ai{border:2px dashed var(--accent);box-shadow:none;background:var(--chrome)}
.st-ai{position:absolute;top:-1px;left:-1px;font:600 10px var(--ui);letter-spacing:.05em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:2px 7px;border-radius:0 0 6px 0}
.sticky.ai .st-body{top:26px!important}

/* ============================================================
   Transcripts studio
   ============================================================ */
#studio{position:absolute;left:16px;right:16px;top:12px;bottom:16px;z-index:50;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-l)}
.sd-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 12px 18px;border-bottom:1px solid var(--line);gap:12px;flex:none}
.sd-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sd-title b{font:600 20px var(--display);color:var(--accent)}
.sd-body{flex:1;display:grid;grid-template-columns:290px 1fr;min-height:0}
.sd-side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--chrome-2)}
.sd-sidehead{padding:12px}
.sd-sidehead .btn{width:100%}
.sd-list{overflow-y:auto;padding:0 8px 12px;display:flex;flex-direction:column;gap:4px}
.sd-item{text-align:left;border:1px solid transparent;background:transparent;border-radius:9px;padding:9px 10px;display:flex;flex-direction:column;gap:3px}
.sd-item:hover{background:var(--chrome)}
.sd-item.on{background:var(--chrome);border-color:var(--accent)}
.sd-it-t{font-weight:600;font-size:13px}
.sd-it-m{font-size:12px;color:var(--ink-2)}
.sd-it-s{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.mini-chip{font:500 11px var(--ui);background:var(--chrome);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--ink-2)}
.mini-chip.ok{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.sd-main{overflow-y:auto;padding:20px 24px 32px;min-width:0}
.sd-main h2{font:600 22px/1.2 var(--display);margin:0 0 4px;text-wrap:balance}
.steps{padding-left:20px;line-height:1.6;max-width:62ch;color:var(--ink-2)}
.steps b{color:var(--ink)}
.stepper{display:flex;gap:6px;margin-bottom:14px}
.stepper span{font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--chrome-2);color:var(--ink-2)}
.stepper span.on{background:var(--accent);color:var(--accent-ink)}
.grid2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 12px}
.tbl{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.tbl .tr{display:grid;grid-template-columns:minmax(0,1.3fr) 80px minmax(0,1.6fr) 80px 70px;gap:8px;align-items:center}
.tbl .th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tbl .orig{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--warn-soft);color:var(--warn);padding:5px 8px;border-radius:6px}

.spkchip{flex:none;font:600 11px var(--ui);border:1px solid var(--line-2);background:var(--chrome);border-radius:5px;padding:2px 6px;min-width:38px;cursor:pointer;color:var(--ink-2)}

    if (k === 'class') e.className = v;

function tidy(ids) {

  its.sort((a, b) => (Math.round(a.y / 60) - Math.round(b.y / 60)) || (a.x - b.x));
  const cols = Math.ceil(Math.sqrt(its.length * 1.5));
  const cw = Math.max(...its.map(i => i.w)) + 20, ch = Math.max(...its.map(i => i.h)) + 20;
  tx('Tidy', () => its.forEach((it, i) => patchItem(it.id, { x: u.x + (i % cols) * cw, y: u.y + Math.floor(i / cols) * ch })));

}
function tidyInFrame(fid) {

    return !childFrames.some(c => inRect(centre(rectOf(it)), rectOf(c)));

  if (!its.length) return;

    its.forEach((it, i) => {

/* ---------- placement ---------- */
function freeOrigin(w, hh) {

  const o = { x: Math.round(vr.x + vr.w / 2 - w / 2), y: Math.round(vr.y + vr.h / 2 - hh / 2) };
  const cand = { x: o.x - 40, y: o.y - 60, w: w + 80, h: hh + 100 };
  const blocked = [...S.items.values()].some(it => !isLine(it) && overlaps(boundsOf(it), cand));

}
function placeIntoFrame(fid, ids) {

  const occupied = [...S.items.values()].filter(o => o.id !== fid && !isLine(o) && !moving.has(o.id) && (isFrame(o) ? contains(rectOf(f), rectOf(o)) : inRect(centre(rectOf(o)), rectOf(f)))).map(rectOf);

    for (let slot = 0; slot < 4000; slot++) {
      const cand = { x: f.x + pad + (slot % cols) * cw, y: f.y + pad + Math.floor(slot / cols) * ch, w: it.w, h: it.h };

      if (cand.y + cand.h + pad > f.y + f.h) patchItem(fid, { h: cand.y + cand.h + pad - f.y });

    }
  }
}

/* ---------- coding engine: house style learned from the team's own outputs ---------- */
const HOUSE_STYLE = `House style, learned from the team's own coded interviews:

CODES
- Title Case, 2 to 6 words, naming one specific finding about the service: a problem, its cause, something that works, or a change the participant wants. Good: "Lack of Middle Grade Staffing", "Inadequate Dialysis Capacity", "Ineffective Bed Management", "Positive Impact of New Consultants", "Need for Dedicated Renal Ward", "Unclear Renal Biopsy Protocol".
- A code must say something, not just name a topic. Weak: "Acute Kidney Injury Dialysis", "Model Development", "Renal Biopsy Process". Better: "ITU Used for Single-Organ Dialysis", "Networked Model With Tertiary Centre", "Overnight Stays for Planned Biopsies".
- Figures matter (beds, slots, costs, waits, caseloads, staffing): keep them in the quote, and code any figure that shows a gap, for example "Consultant Caseload Above RCP Guidance".
- Code positives and things that work as well as problems, with "type":"positive".
- Each of the participant's stated priorities (for example "if you could change three things") gets its own code, usually "Need for ...".

QUOTES
- Use the participant's own words: a full sentence or two that carries the point on its own, never a three-word fragment.
- These transcripts come from automatic speech-to-text and contain mis-heard words. Correct only obvious mis-hearings and stutters so the quote reads as it was said; never reword, summarise or tidy grammar. Examples: "and the stuff we don't have a middle grade stuffing and that is quite upsetting" becomes "We don't have a middle grade staffing and that is quite upsetting"; "compflower Bay" becomes "Cornflower Bay"; "word round" becomes "ward round"; "bid manager" becomes "bed manager"; "haemodysis" becomes "haemodialysis". When you correct anything, list it in "fixed", e.g. "stuffing→staffing".
- Use "..." only to join fragments from the same passage. Never quote the interviewer.

IMPACT
- One sentence on the specific consequence for patients, staff, flow or cost, grounded in what was said. Avoid generic lines such as "can enhance service delivery" or "is essential for patient care".

COVERAGE
- One code per distinct point. Do not split one point into near-identical codes, and do not merge different points.
- Roughly one code per 150 to 250 words the participant speaks: usually 15 to 30 for a 30 to 60 minute interview.
- Ignore consent, introductions, small talk and everything the interviewer says, including suggestions the interviewer makes about other services.

Example rows from the team's previous work:
| Code | Quote | Impact |
| Lack of Middle Grade Staffing | We don't have a middle grade staffing and that is quite upsetting and it's for years, it's not a new thing. | Consultants carry the ward alone, increasing workload and burnout and compromising the quality of care. |
| Inadequate Dialysis Capacity | We have places only for eight patients a week. If I overflow by one or three, as it was on Friday, I'm in big trouble. | Limited inpatient dialysis forces escalation to ITU or transfer, increasing risk and cost. |
| Ineffective Bed Management | You call the bed manager, say look, I got a transplantation that needs to come ASAP under my care. | Renal patients are placed wherever beds are free, so specialist care is spread across the hospital. |
| Unclear Renal Biopsy Protocol | It is not the protocol, the policy is not well laid. | Without a clear protocol, planned biopsies are squeezed before 11 o'clock and patients often stay an extra night, adding cost and bed days. |
| Consultant Caseload Above RCP Guidance | Even though the Royal College of Physicians advised 15 patients per consultant, already we are slightly higher, 5 patients extra. | Each consultant carries 20 to 24 inpatients without a registrar, stretching safe oversight. |
| Positive Impact of New Consultants | We acquired two more and that is the most positive thing. | Two extra consultants have eased the ward rota and improved morale. |`;

const AI = { mode: 'review', busy: false, ctl: null, err: '', sort: null, review: null, sortMode: 'sort', progress: '' };
const aiErr = e => {
  const code = e && e.code;
  if (code === 'cancelled') return '';
  if (code === 'not_granted') return 'Asking Claude was not allowed in this view. Reload and allow it when asked.';
  if (code === 'rate_limited') return 'Too many requests just now. Wait a moment and try again.';

  return 'Claude could not answer just now. Try again in a moment.';

const oneLine = (s, n) => String(s || '').replace(/\s+/g, ' ').trim().slice(0, n);

function boardDigest(opts = {}) {
  const d = S.derived;
  const themes = themeFrames();
  const codes = codesList();
  const tmap = new Map(), cmap = new Map(), tback = new Map(), cback = new Map();
  themes.forEach((f, i) => { const k = 'T' + (i + 1); tmap.set(f.id, k); tback.set(k, f.id); });
  codes.slice(0, 260).forEach((c, i) => { const k = 'c' + (i + 1); cmap.set(c.id, k); cback.set(k, c.id); });
  const qn = opts.quoteLen || 110;
  const codeLine = c => `${cmap.get(c.id)} ${oneLine(c.txt, 80)}${c.src ? ' [' + oneLine(c.src, 40) + ']' : ''}${c.im ? ' — impact: ' + oneLine(c.im, 120) : ''}${qn && c.q ? ' — “' + oneLine(stripQ(c.q), qn) + '”' : ''}`;
  const lines = [];
  for (const f of themes) {
    const par = d.parentOf.get(f.id);
    const own = codes.filter(c => d.themeOf.get(c.id) === f.id && cmap.has(c.id));
    lines.push(`${tmap.get(f.id)} | ${oneLine(f.txt, 60)}${f.k === 'family' ? ' [family' + (par && tmap.has(par) ? ' in ' + tmap.get(par) : ', not yet in a theme') + ']' : par && tmap.has(par) ? ' (sub-theme of ' + tmap.get(par) + ')' : ''} | ${own.length} codes`);
    own.forEach(c => lines.push('   ' + codeLine(c)));
  }
  const un = codes.filter(c => !d.themeOf.get(c.id) && cmap.has(c.id));
  if (un.length) { lines.push('Not yet in a theme:'); un.forEach(c => lines.push('   ' + codeLine(c))); }
  const srcs = allSources().map(([s, n]) => `${s} (${n})`).join('; ');
  return { text: lines.join('\n'), srcs, tmap, cmap, tback, cback, nCodes: codes.length, nThemes: themes.length };
}

    const sm = S.session.summon;

      lastSummon = sm.at; S.follow = null;
      flyTo({ x: sm.x, y: sm.y, w: sm.w, h: sm.h }, { maxZ: 4 });
      resolvePeople([sm.by]).then(() => toast(((S.people.get(sm.by) || {}).name || 'The facilitator') + ' brought everyone here.'));
    }
  }, () => {});
}

/* which board to show: the address hash, then the last one used here, then the home board */
function requestedBoard() { let v = ''; try { v = decodeURIComponent((location.hash || '').slice(1)); } catch (_) {} return /^[A-Za-z0-9_.~-]{1,60}$/.test(v) ? v : null; }
function boardKnown(id) { return id === 'main' || S.boards.has(id); }
function homeBoard() {
  if (!S.caps.store) { const hb = lsGet('local-home', null); if (hb && boardKnown(hb)) return hb; }
  for (const b of S.boards.values()) if (b.home) return b.id;
  return 'main';
}
function loadRegistry() {
  S.boards = new Map();
  const store = S.caps.store;
  if (!store) { (lsGet('local-boards', []) || []).forEach(b => { if (b && b.id && typeof b.title === 'string') S.boards.set(b.id, b); }); return Promise.resolve(); }
  return new Promise(res => {
    let first = true; const done = () => { if (first) { first = false; clearTimeout(t); res(); } };
    const t = setTimeout(done, 5000);
    try {
      store.collection('boards').onSnapshot(snap => {
        for (const ch of snap.docChanges()) {
          const id = ch.doc.id;
          if (ch.type === 'removed') S.boards.delete(id);
          else { const d = ch.doc.data(); if (d && typeof d.title === 'string') S.boards.set(id, Object.assign(clone(d), { id })); }
        }
        if (first) done();
        else if (!pop.hidden && popOwner && popOwner.id === 'b-boards') pop.replaceChildren(boardsEl());
      }, done);
    } catch (_) { done(); }
  });
}
async function chooseBoard() {
  await loadRegistry();
  let id = requestedBoard();
  if (id && !boardKnown(id)) { toast('That board no longer exists, so the usual one has opened.'); id = null; }
  if (!id) { id = lsGet('board', null); if (!boardKnown(id)) id = homeBoard(); }
  S.board = id; lsSet('board', id);
  try { if (location.hash && location.hash !== '#' + id) history.replaceState(null, '', '#' + id); } catch (_) {}
  if (id !== 'main') S.cam = lsGet(camKey(), null) || { x: 0, y: 0, z: 1 };
  applyCam();
}

async function boot() {
  wireToolbar(); renderToolbar(); setTool('select');
  if (S.panelOpen) openPanel('codebook'); else closePanel();
  applyCam(); updateStatus();
  document.title = BRAND; const wm = $('#brand .wordmark'); if (wm) wm.textContent = BRAND;
  let caps = {};
  const cfg = window.FOLIO_CONFIG || window.PARLEY_CONFIG;
  if (window.claude) {
    S.mode = 'artifact';
    const C = window.claude;
    const use = n => { try { return C && C.use ? C.use(n).catch(() => null) : Promise.resolve(null); } catch (_) { return Promise.resolve(null); } };
    const [user, db, room, downloads, sample] = await Promise.all([use('user'), use('db'), use('room'), use('downloads'), use('sample')]);
    caps = { user, db, room, downloads, sample, store: db };
  } else if (cfg && cfg.firebase) {
    S.mode = 'team';
    try { caps = await teamCaps(cfg); }
    catch (e) { console.warn('team mode failed', e); S.mode = 'local'; caps = {}; toast('The team board could not be reached, so this copy is working in this browser only.'); }
  } else S.mode = 'local';
  const user = caps.user || null; S.caps.user = user;
  if (user) {
    try {
      const me = await user.me();
      S.me.uid = me.id || null; S.me.color = me.color || S.me.color; S.me.name = me.name || '';
      S.me.canAdmin = !!me.canEdit || !!me.isOwner; S.me.isOwner = !!me.isOwner;
      const cw = await user.can('data.write');
      if (cw === false) { S.me.canWrite = false; document.body.classList.add('readonly'); }
    } catch (_) {}
  }
  if (!S.me.uid) { let u = lsGet('localUid', null); if (!u) { u = 'local-' + Math.random().toString(36).slice(2, 10); lsSet('localUid', u); } S.me.uid = u; }
  renderToolbar(); updateStatus();
  S.caps.store = caps.store || null; S.caps.dbFor = caps.dbFor || null;
  await chooseBoard();
  const db = boardDb(S.board);
  if (db) subscribe(db);
  else {
    const saved = lsGet(localKey(), null);
    if (saved && Array.isArray(saved.items)) for (const raw of saved.items) { const it = sanitizeItem(raw.id, raw); if (it) S.items.set(it.id, it); }
    if (saved && saved.meta && saved.meta.title) { S.meta.title = saved.meta.title; $('#title').value = saved.meta.title; }
    S.me.canAdmin = true;
    ((saved && saved.comments) || lsGet('local-comments', []) || []).forEach(c => { if (c && c.id) CM.set(c.id, c); });
    ((saved && saved.actions) || lsGet('local-actions', []) || []).forEach(a => { if (a && a.id) AC.set(a.id, a); });
    if (saved && saved.session && typeof saved.session === 'object') S.session = Object.assign(S.session, saved.session);
    const lt = (saved && saved.transcripts) || lsGet('local-transcripts', []); if (Array.isArray(lt)) lt.forEach(t => { if (t && t.id && typeof t.text === 'string') TR.list.set(t.id, t); });
    onFirstLoad(); updateStatus();
  }
  const room = caps.room || null; S.caps.room = room;
  if (room) {
    try {
      room.onPeers(onPeers, () => {});
      sendPresence({ col: S.me.color, vp: viewRect(true), bd: S.board });
    } catch (_) {}
  }
  S.caps.downloads = caps.downloads || null;
  const sample = caps.sample || null; S.caps.sample = sample;
  if (sample) { $('#tab-ai').hidden = false; $('#b-ai').hidden = false; }
  if (TR.open) renderStudio();
}
boot();

/* =========================================================
   Team mode: self-hosted sharing through Firebase
   Active only when the page is served with a config.js that sets
   window.PARLEY_CONFIG.firebase and there is no claude.ai runtime.
   Provides the same db / user / room surface the artifact runtime
   gives, backed by Firestore and passwordless email sign-in.
   ========================================================= */
const TEAM_SDK = 'https://www.gstatic.com/firebasejs/10.14.1/';
const TEAM_DEFAULT_DOMAINS = ['nhs.net', 'nhs.uk'];

function teamDomains(cfg) {
  const list = Array.isArray(cfg.allowedDomains) && cfg.allowedDomains.length ? cfg.allowedDomains : TEAM_DEFAULT_DOMAINS;
  return list.map(d => String(d || '').trim().toLowerCase().replace(/^@/, '')).filter(Boolean);
}
function teamEmailAllowed(cfg, email) {
  const e = String(email || '').trim().toLowerCase();
  const at = e.lastIndexOf('@'); if (at < 1) return false;
  const dom = e.slice(at + 1);
  return teamDomains(cfg).some(d => dom === d || dom.endsWith('.' + d));
}
function teamIsOwner(cfg, email) {
  const owners = Array.isArray(cfg.owners) ? cfg.owners.map(x => String(x).trim().toLowerCase()) : [];
  return !owners.length || owners.includes(String(email || '').trim().toLowerCase());
}
const teamSeg = s => String(s || 'board').toLowerCase().replace(/[^a-z0-9_.~:@+-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80) || 'board';
function teamColour(id) { let hsh = 0; for (const ch of String(id)) hsh = (hsh * 31 + ch.charCodeAt(0)) | 0; return `hsl(${Math.abs(hsh) % 360} 58% 42%)`; }
function teamErr(e) {
  const c = String(e && e.code || '').replace(/^firestore\//, '');
  const map = { 'permission-denied': 'invalid_argument', 'not-found': 'invalid_argument', 'invalid-argument': 'invalid_argument', 'resource-exhausted': 'resource_exhausted', 'unavailable': 'unavailable', 'unauthenticated': 'revoked', 'failed-precondition': 'invalid_argument' };
  return { code: map[c] || 'unavailable', message: (e && e.message) || c };
}

function teamLoadSdk() {
  if (window.firebase && window.firebase.firestore && window.firebase.auth) return Promise.resolve();
  return ['firebase-app-compat.js', 'firebase-auth-compat.js', 'firebase-firestore-compat.js'].reduce((p, f) => p.then(() => loadScript(TEAM_SDK + f)), Promise.resolve());
}

/* ---------- sign-in card ---------- */
function teamCard(state, cfg, actions) {
  const el = $('#signin'); if (!el) return;
  const brand = h('div', { class: 'brandline' }); brand.innerHTML = $('#brand .mark').innerHTML; brand.append(h('span', { class: 'wordmark', text: BRAND }));
  const doms = teamDomains(cfg).map(d => '@' + d).join(' or ');
  const kids = [brand];
  if (state.kind === 'email' || state.kind === 'denied' || state.kind === 'error') {
    const inp = h('input', { class: 'inp', id: 'si-email', type: 'email', autocomplete: 'email', placeholder: 'you' + (teamDomains(cfg)[0] ? '@' + teamDomains(cfg)[0] : '@example.org'), value: state.email || '' });
    const go = () => { const v = inp.value.trim(); if (!v) { inp.focus(); return; } actions.send(v); };
    inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') go(); });
    kids.push(h('h2', { text: 'Sign in to the team board' }),
      h('p', { text: `Use your work email address (${doms}). We will email you a sign-in link; there is no password.` }),
      h('div', { class: 'field' }, h('label', { for: 'si-email', text: 'Work email' }), inp),
      state.kind === 'denied' ? h('div', { class: 'warnbox', text: `That address is not on this board’s allowed list (${doms}). Ask the board owner if you think it should be.` }) : null,
      state.kind === 'error' ? h('div', { class: 'warnbox', text: state.message || 'Something went wrong. Try again.' }) : null,
      h('div', { class: 'row end' }, h('button', { class: 'btn primary', type: 'button', id: 'si-send', text: 'Email me a sign-in link', onclick: go })));
  } else if (state.kind === 'sent') {
    kids.push(h('h2', { text: 'Check your email' }),
      h('p', null, 'We sent a sign-in link to ', h('b', { text: state.email }), '. Open it on this device and you will land back here, signed in.'),
      h('div', { class: 'note', text: 'Nothing arrived after a few minutes? Check the junk folder, then try again.' }),
      h('div', { class: 'row end' }, h('button', { class: 'btn ghost', type: 'button', text: 'Use a different address', onclick: () => actions.restart() })));
  } else if (state.kind === 'confirm') {
    const inp = h('input', { class: 'inp', id: 'si-email', type: 'email', autocomplete: 'email', placeholder: 'the address the link was sent to' });
    const go = () => { const v = inp.value.trim(); if (!v) { inp.focus(); return; } actions.confirm(v); };
    inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') go(); });
    kids.push(h('h2', { text: 'Confirm your email' }),
      h('p', { text: 'This sign-in link was opened on a different device or browser from the one that asked for it. Type the address it was sent to.' }),
      h('div', { class: 'field' }, h('label', { for: 'si-email', text: 'Work email' }), inp),
      state.message ? h('div', { class: 'warnbox', text: state.message }) : null,
      h('div', { class: 'row end' }, h('button', { class: 'btn primary', type: 'button', text: 'Continue', onclick: go })));
  } else if (state.kind === 'name') {
    const inp = h('input', { class: 'inp', id: 'si-name', maxlength: '60', value: state.name || '', placeholder: 'e.g. Sam (renal SpR)' });
    const go = () => { const v = inp.value.trim(); if (!v) { inp.focus(); return; } actions.name(v); };
    inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') go(); });
    kids.push(h('h2', { text: 'What should colleagues call you?' }),
      h('p', { text: 'Shown next to your cursor and on the notes you add. You can keep it short.' }),
      h('div', { class: 'field' }, h('label', { for: 'si-name', text: 'Your name on the board' }), inp),
      h('div', { class: 'row end' }, h('button', { class: 'btn primary', type: 'button', id: 'si-name-go', text: 'Join the board', onclick: go })));
  } else if (state.kind === 'busy') {
    kids.push(h('h2', { text: state.message || 'Signing you in…' }), h('p', { class: 'note', text: 'One moment.' }));
  }
  el.replaceChildren(...kids.filter(Boolean));
  el.hidden = false;
  const first = el.querySelector('input'); if (first) setTimeout(() => first.focus(), 30);
}
function teamCardHide() { const el = $('#signin'); if (el) { el.hidden = true; el.replaceChildren(); } }

/* ---------- sign-in flow ---------- */
function teamSignIn(auth, cfg) {
  return new Promise(resolve => {
    let settled = false;
    const done = u => { if (settled) return; settled = true; teamCardHide(); resolve(u); };
    const actions = {
      send: async email => {
        if (!teamEmailAllowed(cfg, email)) { teamCard({ kind: 'denied', email }, cfg, actions); return; }
        teamCard({ kind: 'busy', message: 'Sending your link…' }, cfg, actions);
        try {
          await auth.sendSignInLinkToEmail(email, { url: location.origin + location.pathname, handleCodeInApp: true });
          lsSet('signinEmail', email);
          teamCard({ kind: 'sent', email }, cfg, actions);
        } catch (e) { teamCard({ kind: 'error', email, message: 'The link could not be sent: ' + ((e && e.message) || 'unknown error') }, cfg, actions); }
      },
      restart: () => teamCard({ kind: 'email' }, cfg, actions),
      confirm: email => finishLink(email),
      name: () => {},
    };
    async function finishLink(email) {
      if (!teamEmailAllowed(cfg, email)) { teamCard({ kind: 'denied', email }, cfg, actions); return; }
      teamCard({ kind: 'busy' }, cfg, actions);
      try {
        await auth.signInWithEmailLink(email, location.href);
        lsSet('signinEmail', null);
        try { history.replaceState(null, '', location.origin + location.pathname); } catch (_) {}
      } catch (e) { teamCard({ kind: 'confirm', message: 'That link did not work: ' + ((e && e.message) || 'it may have expired') }, cfg, actions); }
    }
    auth.onAuthStateChanged(u => {
      if (u && u.email && teamEmailAllowed(cfg, u.email)) { done(u); return; }
      if (u && u.email) { auth.signOut().catch(() => {}); teamCard({ kind: 'denied', email: u.email }, cfg, actions); return; }
      if (auth.isSignInWithEmailLink(location.href)) {
        const stored = lsGet('signinEmail', null);
        if (stored) finishLink(stored); else teamCard({ kind: 'confirm' }, cfg, actions);
        return;
      }
      teamCard({ kind: 'email', email: lsGet('signinEmail', '') || '' }, cfg, actions);
    });
  });
}

/* ---------- capability adapters ---------- */
function teamDb(fs, boardId) {
  const FV = firebase.firestore.FieldValue;
  const base = 'boards/' + boardId + '/';
  const flatten = (obj, prefix, out) => {
    for (const k of Object.keys(obj)) {
      const v = obj[k]; const key = prefix ? prefix + '.' + k : k;
      if (v === null || v === undefined) out[key] = FV.delete();
      else if (v && typeof v === 'object' && !Array.isArray(v)) { if (Object.keys(v).length) flatten(v, key, out); else out[key] = {}; }
      else out[key] = v;
    }
    return out;
  };
  const wrap = p => p.catch(e => { throw teamErr(e); });
  const docRef = ref => ({
    id: ref.id, path: ref.path,
    get: () => wrap(ref.get()),
    set: data => wrap(ref.set(clone(data))),
    update: data => wrap(ref.update(flatten(clone(data), '', {}))),
    delete: () => wrap(ref.delete()),
    onSnapshot: (next, err) => ref.onSnapshot(next, e => { if (err) err(teamErr(e)); }),
    collection: sub => colRef(ref.collection(sub)),
    acquire: async () => ({ acquired: false }),
  });
  const colRef = ref => ({
    path: ref.path,
    doc: id => docRef(id ? ref.doc(id) : ref.doc()),
    add: data => wrap(ref.add(clone(data))).then(r => docRef(r)),
    where: (f, op, v) => colRef(ref.where(f, op, v)), orderBy: (f, d) => colRef(ref.orderBy(f, d || 'asc')), limit: n => colRef(ref.limit(n)),
    get: () => wrap(ref.get()),
    onSnapshot: (next, err) => ref.onSnapshot(next, e => { if (err) err(teamErr(e)); }),
  });
  return { doc: p => docRef(fs.doc(base + p)), collection: p => colRef(fs.collection(base + p)) };
}

function teamUser(fs, boardId, fbUser, cfg, profileName) {
  const uid = fbUser.uid; const email = String(fbUser.email || '').toLowerCase();
  const owner = teamIsOwner(cfg, email);
  const me = { id: uid, name: profileName || '', avatarUrl: '', color: teamColour(uid), email, isOwner: owner, canEdit: owner };
  const cache = new Map(); cache.set(uid, { id: uid, name: me.name, avatarUrl: '', color: me.color, email: null, isMe: true, guest: false });
  const profiles = async ids => {
    const want = [...new Set([].concat(ids).filter(Boolean))];
    const missing = want.filter(id => !cache.has(id));
    if (missing.length) {
      await Promise.all(missing.map(async id => {
        let p = null; try { const s = await fs.doc('boards/' + boardId + '/profiles/' + id).get(); p = s.exists ? s.data() : null; } catch (_) {}
        cache.set(id, { id, name: p && typeof p.name === 'string' ? p.name : '', avatarUrl: '', color: p && typeof p.color === 'string' ? p.color : teamColour(id), email: null, isMe: id === uid, guest: false });
      }));
    }
    const out = {}; for (const id of want) out[id] = cache.get(id); return out;
  };
  return {
    isOwner: async () => owner, canEdit: async () => owner, can: async n => n === 'data.write' ? true : n === 'files.write' || n === 'assets.write' ? owner : false,
    me: async () => me, id: async () => uid, profiles, name: async () => me.name, avatarUrl: async () => null, search: async () => [], email: async () => email,
    signOut: () => firebase.auth().signOut(),
  };
}

function teamRoom(fs, boardId, uid) {
  let peerId = null; try { peerId = sessionStorage.getItem('cw:peer'); } catch (_) {}
  if (!peerId) { peerId = 'p' + Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem('cw:peer', peerId); } catch (_) {} }
  const ref = fs.doc('boards/' + boardId + '/presence/' + peerId);
  const FV = firebase.firestore.FieldValue;
  let mine = {}, dirty = false, timer = 0, lastWrite = 0, stopped = false;
  const write = () => {
    if (stopped) return; dirty = false; lastWrite = now();
    ref.set({ by: uid, p: clone(mine), t: FV.serverTimestamp() }).catch(() => {});
  };
  const scheduleWrite = () => {
    if (timer) return;
    const wait = Math.max(0, 1500 - (now() - lastWrite));
    timer = setTimeout(() => { timer = 0; if (dirty) write(); }, wait);
  };
  const beat = setInterval(() => { if (!dirty) write(); }, 40000);
  write();
  const leave = () => { stopped = true; clearInterval(beat); try { ref.delete(); } catch (_) {} };
  window.addEventListener('pagehide', leave);
  const toPeer = d => {
    const v = d.data() || {}; const t = v.t && typeof v.t.toMillis === 'function' ? v.t.toMillis() : now();
    return { peer: d.id, by: typeof v.by === 'string' ? v.by : null, isMe: v.by === uid, sameTab: d.id === peerId, kind: 'viewer', guest: false, presence: v.p && typeof v.p === 'object' ? v.p : {}, updatedAt: t };
  };
  let peers = [];
  return {
    emit: async () => {}, on: () => () => {},
    presence: async patch => {
      // cursor positions change many times a second: too costly to store, so only the rest travels
      for (const k of Object.keys(patch || {})) { if (k === 'cur') continue; if (patch[k] === null) delete mine[k]; else mine[k] = clone(patch[k]); }
      dirty = true; scheduleWrite();
    },
    peers: () => peers,
    onPeers: (fn, onError) => fs.collection('boards/' + boardId + '/presence').onSnapshot(snap => {
      const cutoff = now() - 100000;
      peers = snap.docs.map(toPeer).filter(p => p.updatedAt >= cutoff);
      fn({ peers, joined: [], left: [], updated: peers });
    }, e => { if (onError) onError(teamErr(e)); }),
    connected: () => !stopped, onConnection: fn => { setTimeout(() => fn(true), 0); return () => {}; },
    canSendToClaudeSession: async () => 'off', sendToClaudeSession: async () => { throw { code: 'claude_unavailable', message: 'not available here' }; },
    join: async () => { throw { code: 'not_permitted', message: 'named rooms are not available here' }; },
  };
}

async function teamCaps(cfg) {
  await teamLoadSdk();
  const app = firebase.apps && firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg.firebase);
  void app;
  const auth = firebase.auth(); const fs = firebase.firestore();
  const boardId = teamSeg(cfg.boardId);
  const fbUser = await teamSignIn(auth, cfg);
  // profile: ask for a display name the first time
  const pref = fs.doc('boards/' + boardId + '/profiles/' + fbUser.uid);
  let name = '';
  try { const s = await pref.get(); if (s.exists && typeof s.data().name === 'string') name = s.data().name; } catch (_) {}
  if (!name) {
    const guess = fbUser.displayName || String(fbUser.email || '').split('@')[0].replace(/[._-]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    name = await new Promise(res => teamCard({ kind: 'name', name: guess }, cfg, { name: v => res(oneLine(v, 60)) }));
    teamCardHide();
    try { await pref.set({ name, color: teamColour(fbUser.uid), email: String(fbUser.email || '').toLowerCase(), ts: now() }); } catch (_) {}
  }
  S.team = { boardId, email: String(fbUser.email || '').toLowerCase(), name };
  // profiles and presence stay under the configured board; every board's documents sit under boards/<id>/
  return { user: teamUser(fs, boardId, fbUser, cfg, name), db: teamDb(fs, boardId), room: teamRoom(fs, boardId, fbUser.uid), downloads: null, sample: null,
    store: { doc: p => fs.doc(p), collection: p => fs.collection(p) }, dbFor: id => teamDb(fs, teamSeg(id)) };
}
})();
